# MOOSA - Android APK build (GitHub Actions, free for public repos)
# Manual trigger only: Actions tab -> "Build MOOSA Android APK" -> Run workflow
#
# CORRECTED 2026-10-18 after checking this workflow against PocketPal's own
# upstream CI (.github/workflows/ci.yml in the source tree). The first version
# would have failed or produced nothing to download:
#  1. android/app/build.gradle applies the google-services plugin, but the repo
#     ships NO google-services.json -> upstream CI creates a dummy one. Added.
#  2. The app has product flavors (prod / e2e), so a plain `assembleDebug`
#     does not match the real output path. Task is now assembleProdDebug and
#     the artifact path is android/app/build/outputs/apk/prod/debug/*.apk.
#  3. Upstream CI creates a dummy .env (app config / signing read it). Added.
#  4. llama.rn is built from source in upstream CI: the env flag
#     ORG_GRADLE_PROJECT_rnllamaBuildFromSource=true, the rnllamaVariants
#     allowlist derived by scripts/verify-android-payload.js, the Hexagon SDK
#     setup action shipped in the repo, and a maximise-disk-space step are
#     all parts of that path. Mirrored here.
#  5. Node is pinned to 22.21.0 and Yarn 1 is installed the way upstream CI
#     does (package.json declares packageManager yarn@1.22.22).
name: Build MOOSA Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Derive the rnllama variant allowlist
        run: |
          set -euo pipefail
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          echo "ORG_GRADLE_PROJECT_rnllamaVariants=$VARIANTS" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up the Hexagon SDK
        uses: ./.github/actions/setup-hexagon-sdk

      - name: Create dummy google-services.json
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-for-ci",
              "storage_bucket": "dummy-project-for-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "ai.moosa.app"
                }
              },
              "api_key": [{
                "current_key": "dummy-api-key-for-ci-builds"
              }]
            }]
          }
          EOL

      - name: Create dummy .env file
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          EOL

      - name: Build debug APK (prod flavor, unmodified source)
        working-directory: android
        run: ./gradlew assembleProdDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moosa-debug-apk
          path: android/app/build/outputs/apk/prod/debug/*.apk
          retention-days: 7
